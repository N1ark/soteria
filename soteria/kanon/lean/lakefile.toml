name = "kanon_bv_values"
defaultTargets = ["Kanon", "Tiny"]

# The Lean library of Kanon, which the generated proofs build on
# (run `lake update kanon` after changing the revision)
# [versionsync: KANON_COMMIT_HASH=95e7342ab3a9dc7d856bfc41d9c39fb25005e725]
[[require]]
name = "kanon"
git = "https://github.com/N1ark/kanon"
rev = "95e7342ab3a9dc7d856bfc41d9c39fb25005e725"
subDir = "lean"

[[lean_lib]]
name = "Kanon"

# The Lean model of Tiny_values (namespace `Tiny`)
[[lean_lib]]
name = "Tiny"
