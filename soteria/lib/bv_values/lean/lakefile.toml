name = "kanon_bv_values"
defaultTargets = ["Kanon"]

# The Lean library of Kanon, which the generated proofs build on
# (run `lake update kanon` after changing the revision)
# [versionsync: KANON_COMMIT_HASH=f3e5c1aa6edf26f771029b76fe8e6ff585a7f69b]
[[require]]
name = "kanon"
git = "https://github.com/N1ark/kanon"
rev = "f3e5c1aa6edf26f771029b76fe8e6ff585a7f69b"
subDir = "lean"

# The Bv_values proofs, and the trial of modules proved once for any
# language (Kanon/Core)
[[lean_lib]]
name = "Kanon"
roots = ["Kanon", "Kanon.Core.Example"]
