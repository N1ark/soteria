name = "kanon_bv_values"
defaultTargets = ["Kanon"]

# The Lean library of Kanon, which the generated proofs build on
# (run `lake update kanon` after changing the revision).
# [versionsync: KANON_LEAN_COMMIT_HASH=ed20adc1ddd6c2fe84e6afcbe8668fb439155c90]
[[require]]
name = "kanon"
git = "https://github.com/N1ark/kanon"
rev = "ed20adc1ddd6c2fe84e6afcbe8668fb439155c90"
subDir = "lean"

[[lean_lib]]
name = "Kanon"

# The core module (../rules/core.knl), proved once, for every language that uses it.
[[lean_lib]]
name = "CoreMod"

# The exists module (../rules/exists.knl), proved once.
[[lean_lib]]
name = "ExistsMod"
